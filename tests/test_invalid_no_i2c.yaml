# Invalid config: multi_gas requires an i2c block.

external_components:
  - source:
      type: local
      path: ../esphome/components

esphome:
  name: multi-multigas-invalid
  libraries:
    - Wire
    - multi-multigas=..

esp32:
  board: esp32dev
  framework:
    type: arduino

multi_gas:
  id: gas_sensors
  co:
    name: "Carbon Monoxide"
