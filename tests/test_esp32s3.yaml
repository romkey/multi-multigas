# ESP32-S3 compile validation.
#
# The framework must be `arduino`: the DFRobot dependency includes Arduino.h
# and Wire.h, which a pure `esp-idf` build does not provide. ESPHome still
# builds this through ESP-IDF with Arduino as a component.

external_components:
  - source:
      type: local
      path: ../components

esphome:
  name: multi-multigas-test-s3
  libraries:
    - Wire
    - multi-multigas=..

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

i2c:
  sda: GPIO8
  scl: GPIO9

multi_gas:
  id: gas_sensors
  debug: true
  update_interval: 60s
  co:
    name: "Carbon Monoxide"
