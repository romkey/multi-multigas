# Minimal ESPHome config for CI compile validation.
# Paths are relative to this file's directory.

external_components:
  - source:
      type: local
      path: ../components

esphome:
  name: multi-multigas-test
  libraries:
    # The DFRobot dependency includes Wire.h, so Arduino's Wire must be present
    # even though the component itself talks over the ESPHome I2C bus.
    - Wire
    - multi-multigas=..

esp32:
  board: esp32dev
  framework:
    type: arduino

i2c:
  sda: GPIO21
  scl: GPIO22

multi_gas:
  id: gas_sensors
  update_interval: 60s
  detected_gas_sensors:
    name: "Detected Gas Sensors"
  duplicate_gas_sensors:
    name: "Duplicate Gas Sensors"
  co:
    name: "Carbon Monoxide"
  o2:
    name: "Oxygen"
