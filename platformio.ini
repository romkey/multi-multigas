; PlatformIO project for building the example firmware.
; The library itself is defined by library.json at the repo root.

[env:example]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<../examples/main.cpp>
lib_deps =
    file://.
    https://github.com/DFRobot/DFRobot_MultiGasSensor
build_flags =
    -DMULTI_MULTIGAS_DEBUG
