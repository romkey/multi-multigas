name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  platformio:
    name: PlatformIO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini', 'library.json') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build example firmware
        run: pio run -e example

  esphome:
    name: ESPHome
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip and PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: esphome-${{ hashFiles('requirements-test.txt') }}

      # ESP-IDF converts PlatformIO libraries into IDF components and rejects
      # local paths, so point the library at the commit under test instead.
      - name: Prepare ESPHome test config
        env:
          LIB_URL: https://github.com/${{ github.repository }}#${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          sed "s|multi-multigas=\\.\\.|multi-multigas=${LIB_URL}|" tests/test.yaml > tests/test-ci.yaml
          sed "s|multi-multigas=\\.\\.|multi-multigas=${LIB_URL}|" tests/test_esp_idf.yaml > tests/test-ci-esp-idf.yaml

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run config validation tests
        run: pytest tests/ -v
        env:
          ESPHOME_TEST_CONFIG: tests/test-ci.yaml

      - name: Validate ESPHome config
        run: esphome config tests/test-ci.yaml

      - name: Compile ESPHome config (Arduino)
        run: esphome compile tests/test-ci.yaml

      - name: Compile ESPHome config (ESP-IDF)
        run: esphome compile tests/test-ci-esp-idf.yaml
